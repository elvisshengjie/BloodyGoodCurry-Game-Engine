<!doctype html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BloodyGoodCurry</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #111; color: #ddd; font-family: sans-serif; }
    #status { position: fixed; top: 10px; left: 10px; z-index: 10; font-size: 12px; }
    #canvas { width: 100%; height: 100%; display: block; outline: none; }
  </style>
</head>
<body>
  <div id="status">Loading...</div>
  <canvas id="canvas" tabindex="-1"></canvas>
  <script>
    var statusEl = document.getElementById("status");
    var totalDependencies = 0;
    var canvasEl = document.getElementById("canvas");
    var webgl2Ctx = null;

    try {
      webgl2Ctx = canvasEl.getContext("webgl2", {
        alpha: false,
        antialias: true,
        depth: true,
        stencil: true,
        premultipliedAlpha: false,
        preserveDrawingBuffer: false
      });
    } catch (e) {
      webgl2Ctx = null;
    }

    if (!webgl2Ctx) {
      if (statusEl) {
        statusEl.style.display = "block";
        statusEl.textContent = "WebGL2 is required but unavailable in this browser/device.";
      }
      throw new Error("WebGL2 initialization failed");
    }

    // Prevent browser context menu from stealing RMB input used by the game.
    window.addEventListener("contextmenu", function (e) {
      e.preventDefault();
    }, { capture: true });

    var Module = {
      canvas: canvasEl,
      preinitializedWebGLContext: webgl2Ctx,
      webglContextAttributes: {
        majorVersion: 2,
        minorVersion: 0
      },
      setStatus: function(text) {
        if (statusEl) statusEl.textContent = text || "";
      },
      monitorRunDependencies: function(left) {
        if (!statusEl) return;
        totalDependencies = Math.max(totalDependencies, left);
        if (left > 0) {
          statusEl.textContent = "Loading files... " + (totalDependencies - left) + "/" + totalDependencies;
        }
      },
      onRuntimeInitialized: function() {
        if (statusEl) statusEl.style.display = "none";
      },
      onAbort: function(reason) {
        if (statusEl) {
          statusEl.style.display = "block";
          statusEl.textContent = "Startup failed: " + reason;
        }
      }
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
