<!doctype html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BloodyGoodCurry</title>
  <style>
    /* Full-page canvas shell used by the generated Emscripten loader. */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #111; color: #ddd; font-family: sans-serif; }
    #status { position: fixed; top: 10px; left: 10px; z-index: 10; font-size: 12px; }
    #canvas { width: 100%; height: 100%; display: block; outline: none; }
  </style>
</head>
<body>
  <div id="status">Loading...</div>
  <canvas id="canvas" tabindex="-1"></canvas>
  <script>
    // This file is only the HTML shell. Emscripten injects the generated JS
    // loader at the placeholder near the bottom of this file, and that JS
    // boots the wasm runtime.
    var statusEl = document.getElementById("status");
    var totalDependencies = 0;
    var canvasEl = document.getElementById("canvas");
    var webgl2Ctx = null;

    // Create WebGL2 up front so we can fail early with a readable message
    // instead of letting the generated runtime fail later.
    try {
      webgl2Ctx = canvasEl.getContext("webgl2", {
        alpha: false,
        antialias: true,
        depth: true,
        stencil: true,
        premultipliedAlpha: false,
        preserveDrawingBuffer: false
      });
    } catch (e) {
      webgl2Ctx = null;
    }

    if (!webgl2Ctx) {
      if (statusEl) {
        statusEl.style.display = "block";
        statusEl.textContent = "WebGL2 is required but unavailable in this browser/device.";
      }
      throw new Error("WebGL2 initialization failed");
    }

    // Prevent browser context menu from stealing RMB input used by the game.
    window.addEventListener("contextmenu", function (e) {
      e.preventDefault();
    }, { capture: true });

    // Optional hosting helper:
    // - window.SOFASPUDS_DATA_BASE_URL = "https://example.com/path"
    // - ?dataBaseUrl=https://example.com/path
    // This lets us keep the large Emscripten .data bundle on separate storage
    // while the HTML/JS/wasm stay on a static host.
    function sofaNormalizeBaseUrl(value) {
      value = (value || "").trim();
      if (!value) return "";
      return value.replace(/\/+$/, "");
    }

    function sofaJoinUrl(baseUrl, path) {
      if (!baseUrl) return path;
      return baseUrl + "/" + String(path || "").replace(/^\/+/, "");
    }

    function sofaReadQueryValue(name) {
      try {
        return new URLSearchParams(window.location.search).get(name) || "";
      } catch (e) {
        return "";
      }
    }

    var sofaDataBaseUrl = sofaNormalizeBaseUrl(
      window.SOFASPUDS_DATA_BASE_URL || sofaReadQueryValue("dataBaseUrl")
    );

    // Emscripten reads the global Module object during startup.
    // The generated JS will:
    // 1. use this canvas
    // 2. reuse the WebGL2 context created above
    // 3. fetch/load the wasm + packaged data files
    // 4. call into C++ main()
    var Module = {
      canvas: canvasEl,
      preinitializedWebGLContext: webgl2Ctx,
      webglContextAttributes: {
        majorVersion: 2,
        minorVersion: 0
      },
      locateFile: function(path, prefix) {
        if (sofaDataBaseUrl && /\.data$/i.test(path)) {
          return sofaJoinUrl(sofaDataBaseUrl, path);
        }
        return (prefix || "") + path;
      },
      // Status text shown while the JS runtime loads wasm and packaged assets.
      setStatus: function(text) {
        if (statusEl) statusEl.textContent = text || "";
      },
      // Fired while Emscripten is loading dependencies such as the .data package.
      monitorRunDependencies: function(left) {
        if (!statusEl) return;
        totalDependencies = Math.max(totalDependencies, left);
        if (left > 0) {
          statusEl.textContent = "Loading files... " + (totalDependencies - left) + "/" + totalDependencies;
        }
      },
      // Once the runtime is ready and C++ startup has finished, hide the status text.
      onRuntimeInitialized: function() {
        if (statusEl) statusEl.style.display = "none";
      },
      // Surface startup failures to the page instead of only the browser console.
      onAbort: function(reason) {
        if (statusEl) {
          statusEl.style.display = "block";
          statusEl.textContent = "Startup failed: " + reason;
        }
      }
    };
  </script>
  <!-- Replaced by Emscripten with the generated JS loader for this build. -->
  {{{ SCRIPT }}}
</body>
</html>
